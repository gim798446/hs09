
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>9주차 예제 1</title>

  <style>
    /* 전체 배경색 변경 */
    body {
      background-color: yellow;
      font-family: Arial, sans-serif;
      margin: 30px;
    }

    /* 제목 */
    h1 {
      color: blue;
    }

    /* 문단 */
    .intro {
      color: black;
      font-size: 18px;
    }

    /* 목록 */
    ul {
      background-color: white;
      padding: 20px 40px;
      width: 200px;
      border-radius: 10px;
    }

    li {
      margin: 8px 0;
    }

    /* 박스 */
    .box {
      background-color: lightblue;
      border: 2px solid blue;
      padding: 20px;
      margin: 20px 0;
      width: 200px;
      text-align: center;
      border-radius: 10px;
    }

    /* 버튼 */
    button {
      background-color: blue;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background-color: darkblue;
    }
  </style>
</head>

<body>
  <h1>제목 h1</h1>

  <p class="intro">
    문단 p — 위에 작성한 CSS가 이 견본 문서에 적용됩니다.
  </p>

  <ul>
    <li>202678076</li>
    <li>김동건</li>
    <li>aisw계열</li>
  </ul>

  <div class="box">div.box</div>

  <button onclick="alert('버튼을 클릭했습니다!')">버튼</button>
</body>
</html>
